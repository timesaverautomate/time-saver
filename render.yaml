services:
  - type: web
    name: timesaver-resend-webhook
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements-webhook.txt
    startCommand: gunicorn --chdir scripts --bind 0.0.0.0:$PORT resend_webhook:app
    healthCheckPath: /health
    envVars:
      - key: RESEND_WEBHOOK_WRITE_ENABLED
        value: "false"
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
