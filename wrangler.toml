name = "timesaver-resend-webhook"
main = "workers/resend-webhook.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
RESEND_WEBHOOK_WRITE_ENABLED = "false"
RESEND_CRM_GENERAL_WRITE_ENABLED = "false"

# Fixture write disabled after verified V26 delivery state.
[[durable_objects.bindings]]
name = "CRM_COORDINATOR"
class_name = "CrmEventCoordinator"

[[migrations]]
tag = "crm-coordinator-v1"
new_sqlite_classes = ["CrmEventCoordinator"]
