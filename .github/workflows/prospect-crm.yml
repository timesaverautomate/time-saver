name: TimeSaver - pesquisar contactos B2B
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Simular ou testar escrita de 2 empresas no CRM (bloqueadas para contacto)'
        required: true
        type: choice
        options:
          - simular
          - teste_escrita_2
        default: simular
  schedule:
    - cron: '15 8 * * 1-5'
permissions:
  contents: read
concurrency:
  group: timesaver-prospeccao-crm
  cancel-in-progress: false
jobs:
  pesquisar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install google-auth requests
      - name: Testes de seguranca do CRM
        run: python -m unittest discover -s tests -p 'test_prospect_crm.py' -v
      - name: Pesquisa CRM (sem envios)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRM_MODE: ${{ github.event_name == 'schedule' && 'simular' || inputs.mode || 'simular' }}
        run: python scripts/prospect_crm.py
