name: TimeSaver - pesquisar contactos B2B
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pesquisar, simular elegibilidade Resend ou testar escrita (sem emails)'
        required: true
        type: choice
        options: [simular, simular_resend, teste_escrita_2]
        default: simular
  schedule:
    - cron: '15 8 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/audit-repository-secrets.py'
      - 'tests/secret-audit.test.mjs'
      - '.github/workflows/prospect-crm.yml'
      - 'scripts/prospect_crm.py'
      - 'scripts/prospect_delivery_link.py'
      - 'scripts/outreach_approved.py'
      - 'tests/test_outreach_approved.py'
      - '.github/workflows/outreach-legal.yml'
      - 'tests/test_prospect_delivery_link.py'
      - 'tests/test_prospect_crm.py'
      - 'scripts/resend_events.py'
      - 'tests/test_resend_events.py'
      - 'scripts/resend_webhook.py'
      - 'tests/test_resend_webhook.py'
      - 'requirements-google.in'
      - 'requirements-google.txt'
      - 'requirements-crm.in'
      - 'requirements-crm.txt'
      - 'requirements-server.in'
      - 'requirements-server.txt'
      - 'requirements-webhook.txt'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && github.workflow || 'timesaver-prospeccao-crm' }}
  cancel-in-progress: false
jobs:
  validar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auditar histórico antes de instalar ferramentas
        run: python scripts/audit-repository-secrets.py
      - name: Instalar dependencias
        run: >-
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-webhook.txt
      - name: Testes de seguranca sem pesquisa ou escrita
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validar servidor opcional sem receber pedidos
        run: PYTHONPATH=scripts gunicorn --check-config resend_webhook:app
  verificar_pesquisa_real:
    # Smoke test controlado: só arranca quando um commit pede [smoke-crm].
    # Sem escrita no CRM, sem chamadas à API de envio Resend.
    needs: validar
    if: >-
      github.event_name == 'push' &&
      github.repository_id == '1452563434' &&
      contains(github.event.head_commit.message, '[smoke-crm]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auditar repositório
        run: python scripts/audit-repository-secrets.py
      - name: Instalar dependências
        run: >-
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-crm.txt
      - name: Executar pesquisa real em modo simulação
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRM_MODE: simular
          CRM_DAILY_WRITE_ENABLED: 'false'
        run: python scripts/prospect_crm.py
  pesquisar:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auditar histórico antes de usar credenciais externas
        run: python scripts/audit-repository-secrets.py
      - name: Instalar dependencias
        run: >-
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-crm.txt
      - name: Testes de seguranca do CRM
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pesquisa ou simulação Resend (sem envios)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CRM_MODE: ${{ github.event_name == 'schedule' && 'diario' || inputs.mode || 'simular' }}
          CRM_DAILY_WRITE_ENABLED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python scripts/prospect_crm.py
