name: Verificar ligacao Sheets no Worker (diagnostico tecnico)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-quote-crm.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  teste:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[quote-crm-test]'))
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Auditar histórico antes de usar credenciais externas
        run: python scripts/audit-repository-secrets.py
      - name: Verificar pedido interno ficticio no formulario e no Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/test-live-quote-crm.mjs
