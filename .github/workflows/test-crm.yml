
name: Testar ligação ao CRM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar-crm:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Auditar histórico antes de usar credenciais externas
        run: python scripts/audit-repository-secrets.py

      - name: Instalar dependências
        run: >-
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-google.txt

      - name: Testar Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python test_crm.py
