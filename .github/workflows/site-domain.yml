name: Ligar domínio e proteger site público
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-domain.yml'
      - 'src/site-proxy.mjs'
      - 'src/contact.mjs'
      - 'src/quote-sheets.mjs'
      - 'src/validation.mjs'
      - 'src/security.mjs'
      - 'config/domain.json'
      - 'scripts/audit-repository-secrets.py'
      - 'scripts/deploy-site-domain.mjs'
      - 'scripts/run-site-domain.mjs'
      - 'scripts/verify-quote-sheet.mjs'
      - 'scripts/zone-security.mjs'
      - 'scripts/probe-public-tls.mjs'
permissions: {}
concurrency:
  group: time-saver-site-domain
  cancel-in-progress: true
jobs:
  configure:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validar site e proteções sem credenciais externas
        run: npm run check
      - name: Verificar padrões de segredos no histórico
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit-repository-secrets.py --github-status
      - name: Verificar acesso ao CRM de pedidos sem gravar
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/verify-quote-sheet.mjs
      - name: Ligar domínio e verificar HTTPS e cabeçalhos
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_API_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/run-site-domain.mjs
