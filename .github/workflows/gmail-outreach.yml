name: TimeSaver - Gmail opt-in (rampa 5 a 30)
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pré-visualizar ou enviar apenas opt-ins documentados'
        required: true
        type: choice
        options: [preview, send]
        default: preview
      confirm:
        description: 'Para envio manual, escrever ENVIAR'
        required: false
        type: string
  schedule:
    - cron: '15 10 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gmail-outreach.yml'
      - '.github/workflows/outreach-legal.yml'
      - 'scripts/gmail_outreach.py'
      - 'scripts/outreach_approved.py'
      - 'scripts/prospect_crm.py'
      - 'tests/test_gmail_outreach.py'
      - 'tests/test_outreach_approved.py'
      - 'tests/test_prospect_crm.py'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'push' && github.workflow || 'timesaver-prospeccao-crm' }}
  cancel-in-progress: false
jobs:
  validar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auditar o repositório
        run: python scripts/audit-repository-secrets.py
      - name: Instalar dependências com hashes
        run: >-
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-crm.txt
      - name: Testar Gmail, CRM e autorizações sem enviar
        run: python -m unittest discover -s tests -p 'test_*.py' -v
  gmail:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Auditar o repositório
        run: python scripts/audit-repository-secrets.py
      - name: Instalar dependências com hashes
        run: >-
          python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-crm.txt
      - name: Testar antes de contactar clientes
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Pré-visualização ou envio estritamente autorizado
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_OAUTH_CLIENT_ID: ${{ secrets.GMAIL_OAUTH_CLIENT_ID }}
          GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.GMAIL_OAUTH_CLIENT_SECRET }}
          GMAIL_OAUTH_REFRESH_TOKEN: ${{ secrets.GMAIL_OAUTH_REFRESH_TOKEN }}
          GMAIL_SEND_ENABLED: ${{ vars.GMAIL_SEND_ENABLED }}
          GMAIL_OUTREACH_MODE: ${{ github.event_name == 'schedule' && (vars.GMAIL_SEND_ENABLED == 'true' && 'send' || 'preview') || inputs.mode || 'preview' }}
          GMAIL_SEND_CONFIRM: ${{ inputs.confirm }}
        run: python scripts/gmail_outreach.py
