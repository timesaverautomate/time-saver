name: Instalar API desativada na Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-backend.yml'
      - 'scripts/cloudflare-bootstrap.mjs'
      - 'scripts/install-cloudflare.mjs'
permissions: {}
concurrency:
  group: time-saver-cloudflare-bootstrap
  cancel-in-progress: false
jobs:
  install:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validar e construir sem credenciais externas
        run: npm run check
      - name: Instalar API com envio desativado
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/install-cloudflare.mjs
