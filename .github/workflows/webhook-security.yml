name: Verificar proteções do webhook Resend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-repository-secrets.py'
      - 'tests/secret-audit.test.mjs'
      - 'workers/resend-webhook.js'
      - 'scripts/deploy-resend-webhook.mjs'
      - 'scripts/verify-resend-webhook-readonly.mjs'
      - 'tests/webhook-readonly.test.mjs'
      - '.github/workflows/webhook-security.yml'
permissions: {}
concurrency:
  group: timesaver-resend-webhook
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository_id == '1452563434' && github.repository == 'timesaverautomate/time-saver' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validar código e proteções sem credenciais externas
        run: npm run check
      - name: Auditar padrões de segredos no histórico sem os publicar
        run: python scripts/audit-repository-secrets.py
      - name: Verificar código instalado e acesso público sem alterar a Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-resend-webhook-readonly.mjs
