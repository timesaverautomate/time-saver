name: Testar envio de email
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-email.yml'
      - 'scripts/test-email.mjs'
      - 'scripts/run-email-diagnostic.mjs'
permissions:
  contents: read
  statuses: write
concurrency:
  group: time-saver-email-diagnostic
  cancel-in-progress: false
jobs:
  test-email:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Enviar teste para o titular da conta Resend e registar resultado
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/run-email-diagnostic.mjs
