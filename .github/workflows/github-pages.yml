name: Preparar e publicar no GitHub Pages
on:
  workflow_dispatch:
    inputs:
      publication:
        description: Modo de publicação
        type: choice
        default: preview
        options: [preview, production]
  push:
    branches: [main]
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validar código, segurança e funcionalidades
        run: npm run check
      - name: Construir versão de revisão
        run: npm run build:pages
      - name: Guardar versão de revisão
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: time-saver-pages-review
          path: out
          include-hidden-files: true
          retention-days: 3
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      statuses: write
    outputs:
      configured: ${{ steps.inspect.outputs.configured }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Auditar segredos no histórico completo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit-repository-secrets.py --github-status
      - name: Verificar configuração Pages
        id: inspect
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-github-pages.mjs
  deploy:
    needs: [build, inspect]
    if: github.ref == 'refs/heads/main' && needs.inspect.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Validar modo de publicação e condições aplicáveis
        id: publication
        env:
          REQUESTED_PUBLICATION: ${{ inputs.publication }}
        run: node scripts/prepare-publication.mjs
      - name: Obter configuração Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Construir publicação
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_INDEXABLE: ${{ steps.publication.outputs.indexable }}
          PAGES_PUBLIC_PREVIEW: ${{ steps.publication.outputs.preview }}
          PAGES_QUOTE_API_ORIGIN: ${{ vars.QUOTE_API_ORIGIN }}
        run: npm run build:pages
      - name: Preparar ficheiros de publicação
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out
          include-hidden-files: true
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

