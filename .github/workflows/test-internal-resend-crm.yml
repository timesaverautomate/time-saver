name: TimeSaver - teste interno Resend CRM
'on':
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Escrever TESTAR para enviar um único email interno'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: timesaver-resend-crm-internal-test
  cancel-in-progress: false
jobs:
  test:
    if: ${{ github.repository == 'timesaverautomate/time-saver' && github.ref == 'refs/heads/main' && inputs.confirm == 'TESTAR' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar dependências aprovadas
        run: python -m pip install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements-crm.txt
      - name: Enviar um email interno e guardar ID no CRM
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TEST_MAIL_FROM: ${{ vars.TEST_MAIL_FROM }}
          TEST_RECIPIENT: timesaverautomate@gmail.com
        run: python scripts/test_internal_resend_crm.py
