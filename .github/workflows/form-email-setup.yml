name: Verificar email do formulário
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: time-saver-form-email-setup
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Validar código sem credenciais externas
        run: npm run check
      - name: Auditar histórico antes de usar credenciais externas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/audit-repository-secrets.py --github-status
      - name: Verificar remetente e configuração disponível
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN_API_KEY: ${{ secrets.RESEND_DOMAIN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/probe-form-email.mjs
