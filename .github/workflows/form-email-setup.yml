name: Verificar email do formulário
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/form-email-setup.yml'
      - 'scripts/probe-form-email.mjs'
permissions: {}
concurrency:
  group: time-saver-form-email-setup
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository_id == '1452563434' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Verificar remetente e configuração disponível
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_DOMAIN_API_KEY: ${{ secrets.RESEND_DOMAIN_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/probe-form-email.mjs
